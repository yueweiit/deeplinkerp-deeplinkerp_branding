name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: main-deeplinkerp_branding-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    name: Server
    env:
      # The native procurement adapters audit this supported production release.
      # Upstream upgrades require a separate audit; never replace the source pins.
      FRAPPE_RELEASE: v16.23.0
      ERPNEXT_RELEASE: v16.23.0
      OVERSEAS_COSTING_COMMIT: a8070a92fb963f7fad97ef40bc2cdac90e4b10bc

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Find tests
        run: |
          echo "Finding tests"
          grep -rn "def test" > /dev/null

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Check inventory JavaScript syntax
        run: |
          node --check deeplinkerp_branding/public/js/inventory_detail.bundle.js
          node --check deeplinkerp_branding/deeplinkerp_branding/page/inventory_location_detail/inventory_location_detail.js
          node --check deeplinkerp_branding/deeplinkerp_branding/page/semi_finished_inventory_detail/semi_finished_inventory_detail.js
          node --check deeplinkerp_branding/deeplinkerp_branding/page/finished_goods_inventory_detail/finished_goods_inventory_detail.js
          node --check deeplinkerp_branding/deeplinkerp_branding/page/mold_inventory_detail/mold_inventory_detail.js

      - name: Check navigation and purchase order extensions
        run: |
          node --test tests/*.test.js
          for module in tests.test_interface_mode tests.test_boot_branding tests.test_interface_mode_metadata tests.test_purchase_order_assets tests.test_unified_purchase_release tests.test_joint_release_guards tests.test_host_maintenance_nginx tests.test_host_maintenance_control tests.test_historical_oa_company tests.test_procurement_navigation tests.test_procurement_release_metadata tests.test_operating_expense_contract tests.test_operating_expense_navigation tests.test_operating_expense_assets tests.test_operating_oa_source tests.test_purchase_source_contract tests.test_purchase_source_adaptation tests.test_dedicated_source_sync_host tests.test_compact_sales_service; do
            python -m unittest -v "$module" || exit 1
          done
          bash -n deploy/production/deploy_unified_purchase.sh

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install MariaDB Client
        run: |
          sudo apt update
          sudo apt-get install mariadb-client

      - name: Setup
        run: |
          pip install frappe-bench
          bench init --frappe-branch "$FRAPPE_RELEASE" --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench

      - name: Install
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app --branch "$ERPNEXT_RELEASE" erpnext https://github.com/frappe/erpnext
          # Exercise the real optional approval helpers without installing their schema.
          costing_source="$RUNNER_TEMP/overseas_costing"
          git clone --depth 1 --no-checkout --branch main https://github.com/yueweiit/deeplinkerp-overseas_costing.git "$costing_source"
          git -C "$costing_source" fetch --depth 1 origin "$OVERSEAS_COSTING_COMMIT"
          git -C "$costing_source" checkout --detach "$OVERSEAS_COSTING_COMMIT"
          bench get-app --skip-assets overseas_costing "$costing_source"
          git -C apps/overseas_costing rev-parse HEAD
          test "$(git -C apps/overseas_costing rev-parse HEAD)" = "$OVERSEAS_COSTING_COMMIT"
          bench get-app deeplinkerp_branding $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app erpnext
          bench --site test_site install-app deeplinkerp_branding
          bench build
        env:
          CI: 'Yes'

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          ./env/bin/pip install pytest
          ./env/bin/python -c 'import frappe, erpnext; from deeplinkerp_branding.services.purchase_native_repost import install; from overseas_costing.scripts.import_oa_logistics import COMPLETED_APPROVAL_STATUSES, resolve_approval_decision; install(); print("Supported native runtime:", frappe.__version__, erpnext.__version__)'
          ./env/bin/python -m pytest -q "$GITHUB_WORKSPACE/deeplinkerp_branding/tests"
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app deeplinkerp_branding
        env:
          TYPE: server
          # Pure XLSX integration imports Frappe without initializing a site/log directory.
          FRAPPE_STREAM_LOGGING: '1'
